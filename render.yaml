services:
  - type: web
    name: story-test
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 100 --bind 0.0.0.0:$PORT 'story:create_app()'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: story-test-db
          property: connectionString

databases:
  - name: story-test-db
    plan: free
    region: singapore
    databaseName: story_test

services:
  - type: web
    name: story-test
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./dockerfile
    dockerContext: .
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: story-test-db
          property: connectionString

databases:
  - name: story-test-db
    plan: free
    region: singapore
    databaseName: story_test

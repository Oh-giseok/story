<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Story{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('post._list') }}">Story</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="메뉴 열기">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('post._list') }}">게시물</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('story_list') }}">스토리</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('reels.reels') }}">릴스</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('dm.chat_room') }}">메시지</a></li>
                </ul>
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.login') }}">로그인</a>
                    <a class="btn btn-light btn-sm" href="{{ url_for('auth.signup') }}">회원가입</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="py-4">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="container">{% for message in messages %}<div class="alert alert-warning">{{ message }}</div>{% endfor %}</div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block script %}{% endblock %}
</body>
</html>

<!-- 릴스 상세 모달. 부모 템플릿에서 include하여 사용합니다. -->
<style>
    .reel-detail-modal .modal-dialog { max-width: 900px; height: 600px; }
    .reel-detail-modal .modal-content { height: 600px; border: none; border-radius: 8px; overflow: hidden; }
    .reel-detail-modal .reel-detail-video { min-height: 0; background: #000; }
    .reel-detail-modal .reel-detail-video video { width: 100%; height: 100%; max-height: 100%; object-fit: contain; }
    .reel-detail-modal .reel-detail-panel { min-height: 0; }
    .reel-detail-modal .reel-detail-comments { flex: 1; min-height: 0; overflow-y: auto; }
    .reel-detail-modal .reel-detail-comment { overflow-wrap: anywhere; }
    .reel-detail-modal .reel-detail-comment-input { border: 0; }
    .reel-detail-modal .reel-detail-comment-input:focus { box-shadow: none; }
    .reel-confirm-modal .modal-content { border-radius: 12px; overflow: hidden; }
    .reel-confirm-modal .btn-action { border: none; border-top: 1px solid #dee2e6; border-radius: 0; padding: 12px; width: 100%; }
    .reel-confirm-modal .btn-action:first-of-type { border-top: none; }
    .reel-confirm-modal.delete-confirm .modal-content { border-radius: 24px; }
    @media (max-width: 767.98px) {
        .reel-detail-modal .modal-dialog { width: 100%; max-width: none; height: 100%; margin: 0; }
        .reel-detail-modal .modal-content { height: 100dvh; border-radius: 0; }
        .reel-detail-modal .reel-detail-body { display: flex; flex-direction: column; }
        .reel-detail-modal .reel-detail-video { height: 48dvh; flex: none; }
        .reel-detail-modal .reel-detail-video video { max-height: 48dvh; }
        .reel-detail-modal .reel-detail-panel { height: calc(52dvh - 0px); flex: 1; }
    }
</style>

<div class="modal fade reel-detail-modal" id="reelDetailModal" tabindex="-1" aria-hidden="true" aria-labelledby="reelDetailModalTitle">
    <div class="modal-dialog modal-dialog-centered position-relative">
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3 reel-detail-close" data-bs-dismiss="modal" aria-label="닫기" style="z-index: 1070; cursor: pointer !important; pointer-events: auto;"></button>
        <div class="modal-content">
            <div class="modal-body reel-detail-body row g-0 h-100 p-0">
                <div class="col-md-7 reel-detail-video d-flex align-items-center justify-content-center position-relative">
                    <video id="reelDetailVideo" controls playsinline></video>
                </div>
                <section class="col-md-5 d-flex flex-column bg-white reel-detail-panel">
                    <header class="p-3 border-bottom d-flex align-items-center justify-content-between">
                        <a id="reelDetailOwnerLink" href="#" class="d-flex align-items-center text-decoration-none text-dark">
                            <img id="reelDetailAvatar" class="rounded-circle me-2 d-none" src="" alt="프로필 이미지" width="32" height="32" style="object-fit: cover;">
                            <i id="reelDetailAvatarIcon" class="bi bi-person-circle fs-4 me-2 text-secondary" aria-hidden="true"></i>
                            <span class="fw-bold" id="reelDetailModalTitle">릴스</span>
                        </a>
                        <button type="button" class="btn btn-link text-dark p-0 border-0 d-none" id="btnReelMoreOption" aria-label="릴스 옵션"><i class="bi bi-three-dots fs-5"></i></button>
                    </header>
                    <div class="p-3 reel-detail-comments">
                        <div class="d-flex mb-3 align-items-start reel-detail-comment">
                            <a id="reelDetailCaptionOwnerLink" href="#" class="d-flex align-items-start text-decoration-none flex-shrink-0">
                                <img id="reelDetailCaptionAvatar" class="rounded-circle me-2 d-none" src="" alt="프로필 이미지" width="32" height="32" style="object-fit: cover;">
                                <i id="reelDetailCaptionAvatarIcon" class="bi bi-person-circle fs-5 me-2 text-secondary" aria-hidden="true"></i>
                            </a>
                            <div class="w-100">
                                <a id="reelDetailCaptionUser" href="#" class="fw-bold me-1 text-decoration-none text-dark">User</a><span id="reelDetailCaption"></span>
                                <div id="reelCaptionEditBox" class="mt-2 d-none">
                                    <textarea id="reelCaptionEditText" class="form-control form-control-sm mb-2" rows="3" style="resize:none;"></textarea>
                                    <div class="d-flex justify-content-end">
                                        <button type="button" class="btn btn-sm btn-primary me-1 py-0 px-2" id="btnSaveReelCaptionEdit">저장</button>
                                        <button type="button" class="btn btn-sm btn-secondary py-0 px-2" id="btnCancelReelCaptionEdit">취소</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr class="my-2">
                        <div id="reelDetailCommentList"></div>
                    </div>
                    <div class="mt-auto p-2 border-top">
                    <form id="reelDetailCommentForm" class="d-flex align-items-center">
                        <input type="hidden" name="csrf_token" value="{{ global_csrf_token() }}">
                        <input type="text" name="content" class="form-control reel-detail-comment-input me-2" placeholder="댓글 달기..." required autocomplete="off">
                        <button type="submit" class="btn btn-link text-primary fw-bold p-0 text-decoration-none small" style="width: 40px;">게시</button>
                    </form>
                    </div>
                </section>
            </div>
        </div>
    </div>
</div>

<div class="modal fade reel-confirm-modal" id="reelOptionModal" tabindex="-1" aria-hidden="true" style="z-index: 1060;">
    <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">
        <button type="button" class="btn btn-action text-danger fw-bold" id="btnOptDeleteReel">삭제</button>
        <button type="button" class="btn btn-action text-dark" id="btnOptEditReel">수정</button>
        <button type="button" class="btn btn-action text-secondary" data-bs-dismiss="modal">취소</button>
    </div></div>
</div>
<div class="modal fade reel-confirm-modal delete-confirm" id="deleteReelConfirmModal" tabindex="-1" aria-hidden="true" style="z-index: 1065;">
    <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">
        <div class="pt-4 pb-3 px-3 text-center"><h6 class="fs-5 mb-1">릴스를 삭제할까요?</h6><small class="text-secondary">이 릴스를 삭제하시겠어요?</small></div>
        <button type="button" class="btn btn-action text-danger fw-bold" id="btnConfirmDeleteReel">삭제</button>
        <button type="button" class="btn btn-action text-dark" data-bs-dismiss="modal">취소</button>
    </div></div>
</div>
<div class="modal fade reel-confirm-modal" id="reelCommentOptionModal" tabindex="-1" aria-hidden="true" style="z-index: 1080;">
    <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">
        <button type="button" class="btn btn-action text-danger fw-bold" id="btnDeleteReelComment">삭제</button>
        <button type="button" class="btn btn-action text-secondary" data-bs-dismiss="modal">취소</button>
    </div></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const modalElement = document.getElementById('reelDetailModal');
    if (!modalElement || modalElement.dataset.initialized === 'true') return;
    modalElement.dataset.initialized = 'true';

    const byId = id => document.getElementById(id);
    const detailModal = bootstrap.Modal.getOrCreateInstance(modalElement);
    const csrfToken = byId('reelDetailCommentForm').elements.csrf_token.value;
    const currentUserId = Number({{ session.get('user_id', 0) }});
    const mypageUrl = {{ url_for('auth.mypage')|tojson }};
    let activeReelId = null;
    let activeCommentId = null;
    let activeDetail = null;
    const modal = id => bootstrap.Modal.getOrCreateInstance(byId(id));

    function updateAvatar(imageId, iconId, source) {
        const image = byId(imageId), icon = byId(iconId);
        if (source) { image.src = source; image.classList.remove('d-none'); icon.classList.add('d-none'); }
        else { image.removeAttribute('src'); image.classList.add('d-none'); icon.classList.remove('d-none'); }
    }

    function updateCardCount(count) {
        document.querySelectorAll(`#reel-card-${activeReelId} .comment-count-text`).forEach(node => node.textContent = count);
        const card = byId(`reel-card-${activeReelId}`);
        card?.querySelectorAll('.post-overlay').forEach(node => {
            node.childNodes.forEach(child => { if (child.nodeType === Node.TEXT_NODE && child.textContent.trim()) child.textContent = ` ${count}`; });
        });
    }

    function renderComments(comments) {
        const list = byId('reelDetailCommentList');
        list.replaceChildren();
        if (!comments.length) {
            const empty = document.createElement('p');
            empty.className = 'text-muted small text-center my-4';
            empty.textContent = '아직 댓글이 없습니다.';
            list.append(empty);
            return;
        }
        comments.forEach(comment => {
            const row = document.createElement('div');
            row.className = 'd-flex mb-3 align-items-start justify-content-between reel-detail-comment';
            const body = document.createElement('div');
            body.className = 'd-flex align-items-start gap-2 flex-grow-1 me-2';
            const profileUrl = `${mypageUrl}?user_id=${encodeURIComponent(comment.user_id)}`;
            const profileLink = document.createElement('a');
            profileLink.href = profileUrl;
            profileLink.className = 'd-flex align-items-start text-decoration-none flex-shrink-0';
            if (comment.profile) {
                const avatar = document.createElement('img');
                avatar.src = comment.profile; avatar.alt = ''; avatar.width = 28; avatar.height = 28;
                avatar.className = 'rounded-circle'; avatar.style.objectFit = 'cover'; profileLink.append(avatar);
            } else {
                const avatar = document.createElement('i'); avatar.className = 'bi bi-person-circle fs-6 text-secondary'; profileLink.append(avatar);
            }
            body.append(profileLink);
            const text = document.createElement('div'); text.className = 'small';
            const author = document.createElement('a'); author.href = profileUrl; author.className = 'fw-bold me-1 text-decoration-none text-dark'; author.textContent = comment.username || '';
            const content = document.createElement('span'); content.textContent = comment.content || '';
            text.append(author, content); body.append(text); row.append(body);
            if (Number(comment.user_id) === currentUserId) {
                const remove = document.createElement('button');
                remove.type = 'button'; remove.className = 'btn btn-link text-secondary p-0 border-0';
                remove.innerHTML = '<i class="bi bi-three-dots fs-5"></i>'; remove.dataset.commentId = comment.id; remove.setAttribute('aria-label', '댓글 옵션');
                row.append(remove);
            }
            list.append(row);
        });
    }

    window.openReelDetailModal = async function(reelId) {
        activeReelId = Number(reelId);
        try {
            const response = await fetch(`/reels/${activeReelId}/detail?fragment=1`, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
            const detail = await response.json();
            if (!response.ok || !detail.id) throw new Error(detail.message || '릴스 정보를 불러오지 못했습니다.');
            activeDetail = detail;
            const ownerProfileUrl = `${mypageUrl}?user_id=${encodeURIComponent(detail.user_id)}`;
            byId('reelDetailModalTitle').textContent = detail.username || '릴스';
            byId('reelDetailCaptionUser').textContent = detail.username || '';
            byId('reelDetailOwnerLink').href = ownerProfileUrl;
            byId('reelDetailCaptionOwnerLink').href = ownerProfileUrl;
            byId('reelDetailCaptionUser').href = ownerProfileUrl;
            byId('reelDetailCaption').textContent = detail.caption || '';
            byId('reelDetailCaption').classList.remove('d-none');
            byId('reelCaptionEditBox').classList.add('d-none');
            byId('reelCaptionEditText').value = detail.caption || '';
            byId('btnReelMoreOption').classList.toggle('d-none', Number(detail.user_id) !== currentUserId);
            const video = byId('reelDetailVideo');
            video.pause(); video.src = detail.video; video.load();
            updateAvatar('reelDetailAvatar', 'reelDetailAvatarIcon', detail.profile);
            updateAvatar('reelDetailCaptionAvatar', 'reelDetailCaptionAvatarIcon', detail.profile);
            renderComments(detail.comments || []);
            detailModal.show();
        } catch (error) { alert(error.message || '릴스 정보를 불러오지 못했습니다.'); }
    };

    async function post(url, values = {}) {
        const body = new URLSearchParams({ csrf_token: csrfToken, ...values });
        const response = await fetch(url, { method: 'POST', headers: { 'X-CSRFToken': csrfToken, 'X-Requested-With': 'XMLHttpRequest', 'Content-Type': 'application/x-www-form-urlencoded' }, body });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.success === false) throw new Error(data.message || '요청을 처리하지 못했습니다.');
        return data;
    }

    byId('btnReelMoreOption').addEventListener('click', () => modal('reelOptionModal').show());
    byId('btnOptDeleteReel').addEventListener('click', () => {
        modal('reelOptionModal').hide();
        modal('deleteReelConfirmModal').show();
    });
    byId('btnOptEditReel').addEventListener('click', () => {
        modal('reelOptionModal').hide();
        byId('reelCaptionEditText').value = byId('reelDetailCaption').textContent;
        byId('reelDetailCaption').classList.add('d-none');
        byId('reelCaptionEditBox').classList.remove('d-none');
    });
    byId('btnCancelReelCaptionEdit').addEventListener('click', () => {
        byId('reelDetailCaption').classList.remove('d-none');
        byId('reelCaptionEditBox').classList.add('d-none');
    });
    byId('btnSaveReelCaptionEdit').addEventListener('click', async () => {
        try {
            const result = await post(`/reels/${activeReelId}/caption`, { caption: byId('reelCaptionEditText').value });
            byId('reelDetailCaption').textContent = result.caption;
            byId('reelDetailCaption').classList.remove('d-none');
            byId('reelCaptionEditBox').classList.add('d-none');
            activeDetail.caption = result.caption;
            const card = byId(`reel-card-${activeReelId}`);
            const cardCaption = card?.querySelector('.raw-caption');
            if (cardCaption) cardCaption.textContent = result.caption;
        } catch (error) { alert(error.message); }
    });
    byId('btnConfirmDeleteReel').addEventListener('click', async () => {
        if (!activeReelId) return;
        try {
            await post(`/reels/${activeReelId}/delete`);
            modal('deleteReelConfirmModal').hide();
            detailModal.hide();
            const card = byId(`reel-card-${activeReelId}`);
            if (card) (card.closest('.col-6, .col-md-3') || card).remove();
            activeReelId = null; activeDetail = null;
        } catch (error) { alert(error.message); }
    });

    byId('reelDetailCommentForm').addEventListener('submit', async event => {
        event.preventDefault();
        const input = event.currentTarget.elements.content;
        const content = input.value.trim();
        if (!content || !activeReelId) return;
        try {
            const result = await post(`/reels/${activeReelId}/comment`, { content });
            activeDetail.comments.push({ id: result.comment_id, user_id: result.user_id, username: result.username, profile: result.comment?.profile_img_url || '', content: result.content });
            input.value = '';
            renderComments(activeDetail.comments);
            updateCardCount(activeDetail.comments.length);
        } catch (error) { alert(error.message); }
    });

    byId('reelDetailCommentList').addEventListener('click', async event => {
        const button = event.target.closest('[data-comment-id]');
        if (!button || !activeDetail) return;
        activeCommentId = Number(button.dataset.commentId);
        modal('reelCommentOptionModal').show();
    });
    byId('btnDeleteReelComment').addEventListener('click', async () => {
        if (!activeCommentId || !activeDetail) return;
        try {
            await post(`/reels/comment/${activeCommentId}/delete`);
            modal('reelCommentOptionModal').hide();
            activeDetail.comments = activeDetail.comments.filter(comment => Number(comment.id) !== activeCommentId);
            renderComments(activeDetail.comments);
            updateCardCount(activeDetail.comments.length);
            activeCommentId = null;
        } catch (error) { alert(error.message); }
    });

    modalElement.addEventListener('hidden.bs.modal', () => {
        byId('reelDetailVideo').pause();
        byId('reelDetailVideo').removeAttribute('src');
        byId('reelDetailVideo').load();
        activeReelId = null; activeDetail = null;
    });
});
</script>

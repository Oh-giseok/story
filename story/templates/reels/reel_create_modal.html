<div class="modal fade createReelModal" id="createReelModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true" aria-labelledby="createReelTitle">
 <div class="modal-dialog modal-dialog-centered modal-lg">
  <div class="modal-content">
   <form method="post" action="{{ url_for('reels.upload') }}" enctype="multipart/form-data" id="createReelForm">
    <input type="hidden" name="csrf_token" value="{{ global_csrf_token() }}">
    <div class="modal-header py-2">
     <button type="button" class="btn btn-link text-dark p-0 d-none" id="reelUploadBack" aria-label="이전"><i class="bi bi-arrow-left fs-4"></i></button>
     <h2 class="modal-title fs-6 fw-bold mx-auto" id="createReelTitle">새 릴스 만들기</h2>
     <button type="button" class="btn btn-link text-primary fw-bold text-decoration-none p-0 d-none" id="reelUploadNext">다음</button>
     <button type="submit" class="btn btn-link text-primary fw-bold text-decoration-none p-0 d-none" id="reelUploadSubmit">공유하기</button>
     <button type="button" class="btn-close ms-2" data-bs-dismiss="modal" aria-label="닫기"></button>
    </div>
    <div class="modal-body p-0" id="reelUploadStep1">
     <div class="upload-box text-center p-4">
      <svg id="reelUploadIcon" aria-label="이미지나 동영상과 같은 미디어를 나타내는 아이콘" class="text-secondary mb-3" fill="currentColor" height="77" role="img" viewBox="0 0 97.6 77.3" width="96">
       <title>이미지나 동영상과 같은 미디어를 나타내는 아이콘</title>
       <path d="M16.3 24h.3c2.8-.2 4.9-2.6 4.8-5.4-.2-2.8-2.6-4.9-5.4-4.8s-4.9 2.6-4.8 5.4c.1 2.7 2.4 4.8 5.1 4.8zm-2.4-7.2c.5-.6 1.3-1 2.1-1h.2c1.7 0 3.1 1.4 3.1 3.1 0 1.7-1.4 3.1-3.1 3.1-1.7 0-3.1-1.4-3.1-3.1 0-.8.3-1.5.8-2.1z" fill="currentColor"></path>
       <path d="M84.7 18.4 58 16.9l-.2-3c-.3-5.7-5.2-10.1-11-9.8L12.9 6c-5.7.3-10.1 5.3-9.8 11L5 51v.8c.7 5.2 5.1 9.1 10.3 9.1h.6l21.7-1.2v.6c-.3 5.7 4 10.7 9.8 11l34 2h.6c5.5 0 10.1-4.3 10.4-9.8l2-34c.4-5.8-4-10.7-9.7-11.1zM7.2 10.8C8.7 9.1 10.8 8.1 13 8l34-1.9c4.6-.3 8.6 3.3 8.9 7.9l.2 2.8-5.3-.3c-5.7-.3-10.7 4-11 9.8l-.6 9.5-9.5 10.7c-.2.3-.6.4-1 .5-.4 0-.7-.1-1-.4l-7.8-7c-1.4-1.3-3.5-1.1-4.8.3L7 49 5.2 17c-.2-2.3.6-4.5 2-6.2zm8.7 48c-4.3.2-8.1-2.8-8.8-7.1l9.4-10.5c.2-.3.6-.4 1-.5.4 0 .7.1 1 .4l7.8 7c.7.6 1.6.9 2.5.9.9 0 1.7-.5 2.3-1.1l7.8-8.8-1.1 18.6-21.9 1.1zm76.5-29.5-2 34c-.3 4.6-4.3 8.2-8.9 7.9l-34-2c-4.6-.3-8.2-4.3-7.9-8.9l2-34c.3-4.4 3.9-7.9 8.4-7.9h.5l34 2c4.7.3 8.2 4.3 7.9 8.9z" fill="currentColor"></path>
       <path d="M78.2 41.6 61.3 30.5c-2.1-1.4-4.9-.8-6.2 1.3-.4.7-.7 1.4-.7 2.2l-1.2 20.1c-.1 2.5 1.7 4.6 4.2 4.8h.3c.7 0 1.4-.2 2-.5l18-9c2.2-1.1 3.1-3.8 2-6-.4-.7-.9-1.3-1.5-1.8zm-1.4 6-18 9c-.4.2-.8.3-1.3.3-.4 0-.9-.2-1.2-.4-.7-.5-1.2-1.3-1.1-2.2l1.2-20.1c.1-.9.6-1.7 1.4-2.1.8-.4 1.7-.3 2.5.1L77 43.3c1.2.8 1.5 2.3.7 3.4-.2.4-.5.7-.9.9z" fill="currentColor"></path>
      </svg>
      <h3 id="reelUploadPrompt" class="h5">사진 및 동영상을 여기에 끌어다 놓으세요</h3>
      <input class="d-none" id="reelVideoInput" type="file" name="video_url" accept="video/mp4,video/quicktime,video/webm" required>
      <button type="button" class="btn btn-primary fw-bold mt-3" id="chooseReelVideo">컴퓨터에서 선택</button>
      <video id="reelSelectionPreview" class="d-none mt-3" style="max-width:100%;max-height:360px;" controls playsinline></video>
     </div>
    </div>
    <div class="modal-body p-0 d-none" id="reelUploadStep2">
     <div class="row g-0">
      <div class="col-md-7 bg-dark d-flex align-items-center justify-content-center" style="min-height:420px;">
       <video id="reelUploadPreview" class="w-100 h-100" style="max-height:520px;object-fit:contain;" controls playsinline></video>
      </div>
      <div class="col-md-5 d-flex flex-column p-3" style="min-height:420px;">
       <div class="d-flex align-items-center gap-3 border-bottom pb-3 mb-3">
        {% if g.user and g.user.profile_img_url %}
        <img src="{{ url_for('static', filename=g.user.profile_img_url) }}" alt="{{ g.user.username }} 프로필 이미지" class="rounded-circle" width="40" height="40" style="object-fit:cover;">
        {% else %}
        <i class="bi bi-person-circle fs-2 text-secondary" aria-hidden="true"></i>
        {% endif %}
        <span class="fw-semibold">{{ g.user.username if g.user else session.get('username', '') }}</span>
       </div>
       <label class="visually-hidden" for="reelCaptionInput">캡션 추가</label>
       <textarea class="form-control border-0 flex-grow-1 p-0" id="reelCaptionInput" name="caption" rows="7" maxlength="2200" placeholder="캡션 추가..." required style="resize:none;box-shadow:none;"></textarea>
       <div class="d-flex align-items-center justify-content-between border-top pt-2 mt-2">
        <i class="bi bi-emoji-smile text-secondary" aria-hidden="true"></i>
        <small class="text-secondary" aria-live="polite"><span id="reelCaptionCount">0</span>/2200</small>
       </div>
       <div class="mt-3">
        <label class="form-label small fw-semibold" for="reelThumbnailInput">대표이미지</label>
        <input class="form-control form-control-sm" id="reelThumbnailInput" type="file" name="thumbnail" accept="image/jpeg,image/png,image/webp" required>
       </div>
      </div>
     </div>
    </div>
   </form>
  </div>
 </div>
</div>

<!-- Swiper 라이브러리 CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<!-- 공통 모달 전용 CSS -->
<style>
    /* 모달 기본 프레임 */
    .post-detail-modal .modal-dialog {
        max-width: 900px;
        height: 600px;
    }
    .post-detail-modal .modal-content {
        height: 600px;
        border: none;
        border-radius: 8px;
        overflow: hidden;
    }

    /* Swiper 슬라이드 및 이미지 영역 */
    .post-detail-modal .modal-feed-swiper {
        width: 100%;
        height: 100%;
        background-color: #000;
        position: relative;
    }
    .post-detail-modal .modal-feed-swiper .swiper-slide {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
    }
    .post-detail-modal .modal-feed-swiper img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    /* --- Swiper 커스텀 네비게이션 버튼 & 페이징 --- */
    .post-detail-modal .modal-feed-swiper .swiper-button-next,
    .post-detail-modal .modal-feed-swiper .swiper-button-prev {
        color: #000 !important;
        background-color: rgba(255, 255, 255, 0.7);
        width: 30px !important;
        height: 30px !important;
        border-radius: 50%;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .post-detail-modal .modal-feed-swiper .swiper-button-next:hover,
    .post-detail-modal .modal-feed-swiper .swiper-button-prev:hover {
        background-color: rgba(255, 255, 255, 0.9);
    }
    .post-detail-modal .modal-feed-swiper .swiper-button-next::after,
    .post-detail-modal .modal-feed-swiper .swiper-button-prev::after {
        font-size: 13px !important;
        font-weight: bold;
    }

    /* 페이징 점(Dot) 커스텀 */
    .post-detail-modal .modal-feed-swiper .swiper-pagination-bullet {
        background: #fff !important;
        opacity: 0.5;
    }
    .post-detail-modal .modal-feed-swiper .swiper-pagination-bullet-active {
        opacity: 1 !important;
        background: #0095f6 !important;
    }

    /* 댓글 영역 높이 유연화 */
    .comments-scroll-area {
        flex: 1;
        overflow-y: auto;
    }

    /* 확인/옵션 모달 CSS */
    .confirm-modal .modal-content {
        border-radius: 12px;
        overflow: hidden;
    }
    .confirm-modal .btn-action {
        border: none;
        border-top: 1px solid #dee2e6;
        border-radius: 0;
        padding: 12px;
        width: 100%;
    }
    .confirm-modal .btn-action:first-of-type {
        border-top: none;
    }
</style>

<!-- 게시물 상세 & 댓글 보기 모달 -->
<div class="modal fade post-detail-modal" id="postDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered position-relative">
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close" style="z-index: 1070; transform: translate(150%, -50%); cursor: pointer !important;pointer-events:auto"></button>

        <div class="modal-content">
            <div class="row g-0 h-100">
                <div class="col-md-7 bg-dark d-flex align-items-center position-relative h-100">
                    <div class="swiper modal-feed-swiper" id="modalDetailSwiper">
                        <div class="swiper-wrapper" id="modalDetailSwiperWrapper"></div>
                        <div class="swiper-pagination"></div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                    </div>
                </div>

                <div class="col-md-5 d-flex flex-column bg-white h-100">
                    <!-- 유저 정보 헤더 -->
                    <div class="p-3 border-bottom d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <img id="detailModalUserImg" src="" alt="프로필 이미지" class="rounded-circle me-2 d-none" width="32" height="32" style="object-fit: cover;">
                            <i id="detailModalUserIcon" class="bi bi-person-circle fs-4 me-2 text-secondary"></i>
                            <span class="fw-bold" id="detailModalUser">User</span>
                        </div>

                        <!-- 더보기(...) 아이콘 버튼 -->
                        <button type="button" class="btn btn-link text-dark p-0 border-0" id="btnPostMoreOption">
                            <i class="bi bi-three-dots fs-5"></i>
                        </button>
                    </div>

                    <!-- 본문 및 댓글 스크롤 영역 -->
                    <div class="p-3 comments-scroll-area">
                        <div class="d-flex mb-3 align-items-start">
                            <img id="detailModalCaptionUserImg" src="" alt="프로필 이미지" class="rounded-circle me-2 d-none" width="32" height="32" style="object-fit: cover;">
                            <i id="detailModalCaptionUserIcon" class="bi bi-person-circle fs-5 me-2 text-secondary"></i>
                            <div class="w-100">
                                <span class="fw-bold me-1" id="detailModalCaptionUser">User</span>
                                <span id="detailModalCaption">게시물 내용</span>

                                <!-- 문구 수정 입력 창 -->
                                <div id="captionEditBox" class="mt-2 d-none">
                                    <textarea id="captionEditText" class="form-control form-control-sm mb-2" rows="3" style="resize:none;"></textarea>
                                    <div class="d-flex justify-content-end">
                                        <button type="button" class="btn btn-sm btn-primary me-1 py-0 px-2" id="btnSaveCaptionEdit">저장</button>
                                        <button type="button" class="btn btn-sm btn-secondary py-0 px-2" id="btnCancelCaptionEdit">취소</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr class="my-2">
                        <div id="detailModalCommentList"></div>
                    </div>

                    <!-- 댓글 입력 폼 -->
                    <div class="mt-auto comment-input-box p-2 border-top">
                        <form id="detailCommentForm" action="" method="post" class="d-flex align-items-center" onsubmit="handleDetailCommentSubmit(event)">
                            <input type="text" id="detailCommentInput" name="content" class="form-control comment-input me-2" placeholder="댓글 달기..." required autocomplete="off">
                            <button type="submit" class="btn btn-link text-primary fw-bold p-0 text-decoration-none small" style="width: 40px;">게시</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 게시물 더보기 옵션 모달 -->
<div class="modal fade confirm-modal" id="postOptionModal" tabindex="-1" aria-hidden="true" style="z-index: 1060;">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <button type="button" class="btn btn-action text-danger fw-bold" id="btnOptDeletePost">삭제</button>
            <button type="button" class="btn btn-action text-dark" id="btnOptEditPost">수정</button>
            <button type="button" class="btn btn-action text-secondary" data-bs-dismiss="modal">취소</button>
        </div>
    </div>
</div>

<!-- 삭제 확인 모달 -->
<div class="modal fade confirm-modal" id="deleteConfirmModal" tabindex="-1" aria-hidden="true" style="z-index: 1065;">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="pt-4 pb-3 px-3 text-center">
                <h6 class="fw-bold fs-5 mb-1">게시물을 삭제하시겠어요?</h6>
                <small class="text-secondary">삭제된 게시물은 복구할 수 없습니다.</small>
            </div>
            <button type="button" class="btn btn-action text-danger" id="btnConfirmDeletePost">삭제</button>
            <button type="button" class="btn btn-action text-dark" data-bs-dismiss="modal">취소</button>
        </div>
    </div>
</div>

<script>
    // 피드 페이지는 post_list.html에서 상세 모달 이벤트와 Bootstrap 인스턴스를
    // 관리한다. 마이페이지에는 피드용 .btn-open-detail 버튼이 없으므로 여기서
    // 마이페이지의 인라인 onclick 흐름에 맞춰 옵션 메뉴 동작을 연결한다.
    // 이 include는 Bootstrap 스크립트보다 먼저 렌더링되므로 DOMContentLoaded까지
    // 초기화를 미뤄야 bootstrap.Modal을 사용할 수 있다.
    document.addEventListener('DOMContentLoaded', function () {
    if (!document.querySelector('.btn-open-detail')) {
        const postDetailModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('postDetailModal'));
        const postOptionModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('postOptionModal'));
        const deleteConfirmModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('deleteConfirmModal'));

    document.querySelectorAll('.btn-open-detail').forEach(btn => {
            btn.addEventListener('click', function() {
                const postId = this.getAttribute('data-post-id');
                currentActivePostId = postId;
                const card = document.getElementById(`post-card-${postId}`);

                const postUserName = card.getAttribute('data-user-name');
                const postUserImg = card.getAttribute('data-user-img');

                document.getElementById('detailModalUser').textContent = postUserName;
                document.getElementById('detailModalCaptionUser').textContent = postUserName;

                // [본인 확인] 작성자와 로그인 사용자가 같을 때만 (...) 노출
                const btnPostMoreOption = document.getElementById('btnPostMoreOption');
                if (postUserName === currentUsername) {
                    btnPostMoreOption.classList.remove('d-none');
                } else {
                    btnPostMoreOption.classList.add('d-none');
                }

                // 프로필 이미지 세팅
                const modalUserImgElem = document.getElementById('detailModalUserImg');
                const modalUserIconElem = document.getElementById('detailModalUserIcon');
                const captionUserImgElem = document.getElementById('detailModalCaptionUserImg');
                const captionUserIconElem = document.getElementById('detailModalCaptionUserIcon');

                if (postUserImg) {
                    modalUserImgElem.src = postUserImg;
                    modalUserImgElem.classList.remove('d-none');
                    modalUserIconElem.classList.add('d-none');

                    captionUserImgElem.src = postUserImg;
                    captionUserImgElem.classList.remove('d-none');
                    captionUserIconElem.classList.add('d-none');
                } else {
                    modalUserImgElem.classList.add('d-none');
                    modalUserIconElem.classList.remove('d-none');

                    captionUserImgElem.classList.add('d-none');
                    captionUserIconElem.classList.remove('d-none');
                }

                const caption = card.querySelector('.post-caption-text').textContent;
                const rawImages = card.querySelector('.raw-images').textContent.trim();
                const commentItems = card.querySelectorAll('.raw-comments .comment-item');

                document.getElementById('detailCommentForm').setAttribute('data-post-id', postId);
                document.getElementById('detailModalCaption').textContent = caption;
                document.getElementById('detailModalCaption').classList.remove('d-none');
                document.getElementById('captionEditBox').classList.add('d-none');

                // 이미지 Swiper 반영
                const wrapper = document.getElementById('modalDetailSwiperWrapper');
                wrapper.innerHTML = '';

                if (rawImages) {
                    const imgList = rawImages.split(',');
                    imgList.forEach(src => {
                        const slide = document.createElement('div');
                        slide.className = 'swiper-slide';
                        slide.innerHTML = `<img src="${src}" alt="게시물 이미지">`;
                        wrapper.appendChild(slide);
                    });

                    if (modalDetailSwiperInstance) modalDetailSwiperInstance.destroy();

                    setTimeout(() => {
                        const nextBtn = document.querySelector('#modalDetailSwiper .swiper-button-next');
                        const prevBtn = document.querySelector('#modalDetailSwiper .swiper-button-prev');
                        const pagination = document.querySelector('#modalDetailSwiper .swiper-pagination');

                        const modalSwiperOptions = { observer: true, observeParents: true };

                        if (imgList.length > 1) {
                            modalSwiperOptions.navigation = { nextEl: '#modalDetailSwiper .swiper-button-next', prevEl: '#modalDetailSwiper .swiper-button-prev' };
                            modalSwiperOptions.pagination = { el: '#modalDetailSwiper .swiper-pagination', clickable: true };
                            if (nextBtn) nextBtn.style.display = '';
                            if (prevBtn) prevBtn.style.display = '';
                            if (pagination) pagination.style.display = '';
                        } else {
                            if (nextBtn) nextBtn.style.display = 'none';
                            if (prevBtn) prevBtn.style.display = 'none';
                            if (pagination) pagination.style.display = 'none';
                        }

                        modalDetailSwiperInstance = new Swiper('#modalDetailSwiper', modalSwiperOptions);
                    }, 100);
                }

                renderModalComments(commentItems);
                postDetailModal.show();
            });
        });

        // 더보기 아이콘 클릭 -> 더보기 옵션 모달 열기
        document.getElementById('btnPostMoreOption').addEventListener('click', function() {
            postOptionModal.show();
        });

        // 옵션 모달 -> 삭제버튼 클릭
        document.getElementById('btnOptDeletePost').addEventListener('click', function() {
            postOptionModal.hide();
            deleteConfirmModal.show();
        });

        // 최종 삭제 확인 -> AJAX 삭제 처리
        document.getElementById('btnConfirmDeletePost').addEventListener('click', function() {
            if (!currentActivePostId) return;

            fetch(`/post/delete/${currentActivePostId}`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    deleteConfirmModal.hide();
                    postDetailModal.hide();

                    // DOM에서 삭제된 게시물 카드 제거
                    const card = document.getElementById(`post-card-${currentActivePostId}`);
                    if (card) (card.closest('.col-6, .col-md-4') || card).remove();
                } else {
                    alert(data.message || '삭제 실패');
                }
            });
        });

        // 옵션 모달 -> 수정버튼 클릭
        document.getElementById('btnOptEditPost').addEventListener('click', function() {
            postOptionModal.hide();
            const currentCaption = document.getElementById('detailModalCaption').textContent;

            document.getElementById('captionEditText').value = currentCaption;
            document.getElementById('detailModalCaption').classList.add('d-none');
            document.getElementById('captionEditBox').classList.remove('d-none');
        });

        // 문구 수정 저장 처리
        document.getElementById('btnSaveCaptionEdit').addEventListener('click', function() {
            const newCaption = document.getElementById('captionEditText').value;
            const formData = new FormData();
            formData.append('caption', newCaption);

            fetch(`/post/edit/${currentActivePostId}`, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('detailModalCaption').textContent = data.caption;
                    document.getElementById('detailModalCaption').classList.remove('d-none');
                    document.getElementById('captionEditBox').classList.add('d-none');

                    // 피드 메인 카드 문구도 업데이트
                    const card = document.getElementById(`post-card-${currentActivePostId}`);
                    if (card) {
                        const captionText = card.querySelector('.post-caption-text');
                        if (captionText) captionText.textContent = data.caption;
                        const rawCaption = card.querySelector('.raw-caption');
                        if (rawCaption) rawCaption.textContent = data.caption;
                        const captionDisplay = card.parentElement.querySelector('.raw-caption-display');
                        if (captionDisplay) captionDisplay.textContent = data.caption;
                    }
                } else {
                    alert(data.message || '수정 실패');
                }
            });
        });

        // 문구 수정 취소
        document.getElementById('btnCancelCaptionEdit').addEventListener('click', function() {
            document.getElementById('detailModalCaption').classList.remove('d-none');
            document.getElementById('captionEditBox').classList.add('d-none');
        });
    }
    });
</script>

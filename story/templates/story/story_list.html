{% extends 'base.html' %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/story_style.css') }}?v=1.1">
{% endblock %}

{% block content %}

<!-- 스토리 목록  -->
<div class="container my-4">

    <!-- 홈 상단 정렬 박스 -->
     <div class="insta-story-container">

         <!-- 새 스토리 올리기 -->
         <a href="{{ url_for('story.story_create') }}"
            class="insta-story-item"
            style="text-decoration: none;">

             <div class="insta-story-ring"
                  style="background: #e0e0e0; padding: 0;">

                 <div class="insta-story-no-img"
                      style="background-color: #dbdbdb;">

                     <i class="bi bi-plus-lg"
                        style="font-size: 1.8rem; color: #555555;"></i>

                 </div>

    </div>

    <div class="insta-story-username">
        새 스토리
    </div>

    <div class="insta-story-time">
        올리기
    </div>

</a>
        {% if story_list %}

            {% for story in story_list %}
            <!-- 개별 스토리 아이템 -->
           <a href="{{ url_for('story.detail', story_id=story.id) }}" class="insta-story-item" style="text-decoration: none;">

                <!-- 스토리 링 및 프로필 -->
                <div class="insta-story-ring">
                    {% if story.user.profile_img_url %}
                        <img src="{{ url_for('static', filename=story.user.profile_img_url) }}"
                             alt="프로필 이미지"
                             class="insta-story-img">
                    {% else %}
                        <div class="insta-story-no-img">
                            <i class="bi bi-person-fill" style="font-size: 1.8rem; color: #ffffff;"></i>
                        </div>
                    {% endif %}
                </div>

                    <!-- 아이디 표시 -->
                    <div class="insta-story-username">
                        {{ story.user.username }}
                    </div>

                </a>
            {% endfor %}
        {% else %}
            <!-- 스토리가 없을 때 화면 -->
            <div class="insta-story-empty">현재 활성화된 스토리가 없습니다.</div>
        {% endif %}

    </div>
</div>
{% endblock %}
